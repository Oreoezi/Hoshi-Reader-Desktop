app-id: de.manhhao.hoshi
branch: stable
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
command: hoshi-reader
finish-args:
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --socket=pulseaudio
  - --talk-name=org.freedesktop.secrets
modules:
  - name: hoshi-reader
    buildsystem: simple
    build-commands:
      - install -Dm755 hoshi-reader /app/bin/hoshi-reader
      - install -Dm644 de.manhhao.hoshi.desktop /app/share/applications/de.manhhao.hoshi.desktop
      - install -Dm644 de.manhhao.hoshi.png /app/share/icons/hicolor/128x128/apps/de.manhhao.hoshi.png
    sources:
      - type: file
        path: ../src-tauri/target/release/hoshi-reader
        dest-filename: hoshi-reader
      - type: file
        path: de.manhhao.hoshi.desktop
      - type: file
        path: ../src-tauri/icons/128x128.png
        dest-filename: de.manhhao.hoshi.png
